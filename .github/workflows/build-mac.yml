name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        run: npm run make

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Run-macOS-DMG
          path: out/make/**/*.dmg
          if-no-files-found: error
          retention-days: 14
